<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - Fashion Store</title>
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" alt="Fashion Store Logo" class="brand-logo">
                <span class="brand-name">FASHION STORE</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="main-menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#products-section">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#about-section">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- order success -->
    <div class="container success-section">
        <div class="success-card">
            <div class="success-content">
               
                <h1 class="success-icon">✓</h1>
                <h2 class="success-title">Thank You!</h2>
                <p class="success-message">Your order has been placed successfully.</p>
                
              
                <div class="order-details">
                    <div class="detail-row">
                        <span class="detail-label">Order ID:</span>
                        <span class="detail-value" id="order-id">#FS2026</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Order Date:</span>
                        <span class="detail-value" id="order-date"></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Total Amount:</span>
                        <span class="detail-value" id="order-total">₹0</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Name:</span>
                        <span class="detail-value" id="customer-name">Guest User</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Phone:</span>
                        <span class="detail-value" id="customer-phone">-</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Delivery Address:</span>
                        <span class="detail-value" id="delivery-address">-</span>
                    </div>
                </div>

          
                <div class="action-buttons">
                    <a href="index.html" class="continue-shopping-btn">Continue Shopping</a>
                    <button class="download-receipt-btn" onclick="downloadReceipt()">
                        Download Receipt
                    </button>
                </div>
            </div>
        </div>
    </div>


    <footer class="site-footer">
        <div class="container text-center">
            <p class="copyright">&copy; 2026 Fashion Store. All rights reserved.</p>
        </div>
    </footer>

  
    <script>

document.addEventListener("DOMContentLoaded", function(){

    const customerData = JSON.parse(localStorage.getItem("customerInfo")) || {};
    const total = localStorage.getItem("orderTotal") || "0";

    // Order ID
    document.getElementById("order-id").textContent =
    "#FS" + Math.floor(Math.random()*10000);

    // Date
    document.getElementById("order-date").textContent =
    new Date().toLocaleDateString("en-IN");

    // Total
    document.getElementById("order-total").textContent =
    "₹" + total;

    // Customer info
    if(customerData.name){
        document.getElementById("customer-name").textContent = customerData.name;
    }

    if(customerData.phone){
        document.getElementById("customer-phone").textContent = customerData.phone;
    }

    if(customerData.address){
        document.getElementById("delivery-address").textContent = customerData.address;
    }

});


// Download receipt
function downloadReceipt(){

    const orderId = document.getElementById("order-id").textContent;
    const orderDate = document.getElementById("order-date").textContent;
    const orderTotal = document.getElementById("order-total").textContent;
    const customerName = document.getElementById("customer-name").textContent;
    const customerPhone = document.getElementById("customer-phone").textContent;
    const deliveryAddress = document.getElementById("delivery-address").textContent;

    const receiptText = `
FASHION STORE
=====================
ORDER RECEIPT
=====================
Order ID: ${orderId}
Date: ${orderDate}

Customer: ${customerName}
Phone: ${customerPhone}
Address: ${deliveryAddress}

Total: ${orderTotal}

Thank you for shopping!
`;

    const blob = new Blob([receiptText], {type:"text/plain"});
    const link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "receipt_" + orderId + ".txt";
    link.click();
}


// Clear cart when leaving page
window.addEventListener("beforeunload", function(){

    localStorage.removeItem("cart");
    // localStorage.removeItem("orderTotal");
    localStorage.removeItem("customerInfo");

});

</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
